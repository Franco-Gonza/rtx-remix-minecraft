buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'

group = 'com.nvidia.rtxremix.forge'
version = project.findProperty('mod_version') ?: '0.1.0'
base {
    archivesName = 'rtx-remix-forge-1.20.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../rtxremix-java/src']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'rtxremix'

            // Mixin debug and remap properties
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                rtxremix {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "rtxremix.refmap.json"
    config "rtxremix.mixins.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.findProperty('forge_version') ?: '1.20.1-47.4.29'}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "rtx-remix-forge",
            "Specification-Vendor"    : "NVIDIA",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "NVIDIA",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    from('../LICENSE') {
        into 'META-INF'
    }
    from('../NOTICE') {
        into 'META-INF'
    }
}

jar.finalizedBy('reobfJar')

tasks.register('packageDistJar', Zip) {
    group = 'build'
    description = 'Assembles the reobfuscated Forge 1.20.1 JAR with the bundled native runtime'
    dependsOn 'jar', 'reobfJar'

    archiveBaseName = 'rtx-remix-forge-1.20.1'
    archiveVersion = project.version.toString()
    archiveExtension = 'jar'
    destinationDirectory = layout.buildDirectory.dir('distributions')

    from(zipTree(jar.archiveFile))

    from('../packaging/licenses') {
        into 'native/licenses'
    }
    from('../packaging/rtx.conf') {
        into 'native'
    }
    from('../remix-runtime/native/rtx-remix') {
        into 'native/rtx-remix'
    }
    from('../remix-runtime/native/textures') {
        into 'native/textures'
    }
    from('../remix-runtime/native/remix-sdk-win64') {
        into 'native/remix-sdk'
        exclude '**/*.pdb'
    }
}

tasks.register('packageForge', Zip) {
    group = 'build'
    description = 'Assembles the complete Forge 1.20.1 distribution bundle'
    dependsOn 'packageDistJar'

    archiveBaseName = 'rtx-remix-forge-1.20.1'
    archiveClassifier = 'bundle'
    destinationDirectory = layout.buildDirectory.dir('distributions')

    from(tasks.named('packageDistJar').flatMap { it.archiveFile }) {
        into 'mods'
    }
    from('../packaging/INSTALL.md') {
        into ''
    }
    from('../packaging/install.bat') {
        into ''
    }
    from('../packaging/installer.ps1') {
        into ''
    }
}
